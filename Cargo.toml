[package]
name = "gemini-cdp-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
# Асинхронный рантайм и сеть
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

# TUI и терминальная графика
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui-image = "3.0"
image = "0.25"

# Системный буфер обмена
arboard = "3.4"

# Парсер Markdown для разметки ответов
pulldown-cmark = "0.12"
base64 = "0.21.7"