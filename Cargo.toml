[package]
name = "gemini-cdp-cli"
version = "0.1.0"
edition = "2021"
default-run = "evil-gemini"
description = "EVIL GEMINI — a lightweight desktop client for Google AI Mode"

[dependencies]
# Асинхронный рантайм и сеть
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
base64 = "0.22"
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
sha2 = "0.10"
httpdate = "1"

# TUI и терминальная графика
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Системный буфер обмена
arboard = "3.4"

# Парсер Markdown для разметки ответов
pulldown-cmark = "0.12"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
wry = "0.57"
tao = "0.34"
window-vibrancy = "0.7"
rfd = "0.17"

[target.'cfg(windows)'.build-dependencies]
webview2-com-sys = "0.39"

[[bin]]
name = "evil-gemini"
path = "src/bin/evil-gemini.rs"
